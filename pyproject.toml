[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-enterprise-intelligence"
version = "0.8.0"
description = "Persistent Enterprise Intelligence Platform integration and intelligence runtime"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.8", "jsonschema>=4.23"]
api = ["fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10"]
postgres = ["psycopg[binary]>=3.2"]
research = ["httpx>=0.28", "beautifulsoup4>=4.12"]

[project.scripts]
ec = "ec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
