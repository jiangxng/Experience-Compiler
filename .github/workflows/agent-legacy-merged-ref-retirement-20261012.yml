name: One-time EC Agent legacy ref retirement
on:
  pull_request:
    paths: [".github/workflows/agent-legacy-merged-ref-retirement-20261012.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/agent-legacy-merged-ref-retirement-20261012.yml"]
permissions:
  contents: write
  pull-requests: read
jobs:
  audit-and-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='jiangxng'||repo!=='Experience-Compiler')throw Error('wrong repo');
            const execute=context.eventName==='push'&&context.ref==='refs/heads/main';
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(execute&&main!==context.sha)throw Error('main moved since event');
            const targets=[["docs/align-enterprise-agent-boundaries-20260924","a5d86dc4e7666b140193b2c912aec419f096a50c"],["docs/clarify-ec-vs-enterprise-agent-package","9e587bee1cacd641e8164a6140cbfa55e4d1fd05"],["evo/app-platform-agent-package-convergence-v0.1","bb3edbf24bd2084b7e432f81b5bbd21520ebe5db"]];
            const get=async b=>{try{return (await github.rest.git.getRef({owner,repo,ref:'heads/'+b})).data.object.sha;}catch(e){if(e.status===404)return null;throw e;}};
            for(const [branch,sha] of targets){
             const cmp=(await github.rest.repos.compareCommits({owner,repo,base:sha,head:main})).data;
             if(cmp.behind_by!==0||cmp.merge_base_commit?.sha!==sha)throw Error('unmerged branch '+branch);
             if((await get(branch))!==sha)throw Error('branch moved/absent '+branch);
             const pr=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
             if(pr.some(p=>p.base.ref===branch||(p.head.ref===branch&&p.head.repo?.full_name===owner+'/'+repo)))throw Error('branch used by open PR '+branch);
             if(!execute){core.info('AUDIT_ONLY '+branch);continue;}
             if((await get(branch))!==sha)throw Error('branch raced '+branch);
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
             core.info('DELETED_AGENT_EC '+branch);
            }
            if(execute){
             const self='chore/agent-history-convergence-20261012';
             const p=(await github.rest.pulls.list({owner,repo,state:'closed',head:owner+':'+self,per_page:100})).data.find(x=>x.merged_at&&x.base.ref==='main');
             if(!p||await get(self)!==p.head.sha)throw Error('cleanup PR not merged/source moved');
             const cmp=(await github.rest.repos.compareCommits({owner,repo,base:p.head.sha,head:main})).data;
             if(cmp.behind_by!==0||cmp.merge_base_commit?.sha!==p.head.sha)throw Error('cleanup source not in main');
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+self});
             core.info('DELETED_AGENT_EC_CLEANUP_SOURCE '+self);
             core.info('EC_AGENT_RETIRED_3');
            }
