# Development integration stack, not a production topology.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ec
      POSTGRES_PASSWORD: ec-dev-only
      POSTGRES_DB: ec
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/001_canonical.sql:/docker-entrypoint-initdb.d/001_canonical.sql:ro
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["search"]
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant:/qdrant/storage"]
  opensearch:
    image: opensearchproject/opensearch:latest
    profiles: ["search"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9200:9200"]
    volumes: ["opensearch:/usr/share/opensearch/data"]
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    profiles: ["analytics"]
    ports: ["8123:8123", "9000:9000"]
    volumes: ["clickhouse:/var/lib/clickhouse"]
volumes:
  pgdata: {}
  qdrant: {}
  opensearch: {}
  clickhouse: {}
